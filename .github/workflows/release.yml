name: Notarized Release

# Builds the official auto-update release in CI, signed with the Developer ID
# certificate, notarized and stapled by Apple, and verified by Sparkle EdDSA
# signatures. Releases up to 0.1.11 were signed with the self-signed "zap"
# certificate. Sparkle still accepts the update because the EdDSA key in
# Info.plist is unchanged, but the new code-signing identity makes macOS ask
# existing users to grant Accessibility access again once.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish notarized release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          APP_VERSION="$(make -s print-app-version)"
          BUILD_NUMBER="$(make -s print-build-number)"
          BUILD_TAG="$(make -s print-build-tag)"
          VERSION="${TAG#v}"
          DMG_PATH="dist/Zap-${VERSION}.dmg"
          APPCAST_PATH="dist/appcast.xml"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.1.0." >&2
            exit 1
          fi

          if [ "$TAG" != "$BUILD_TAG" ]; then
            echo "Workflow tag $TAG must match BUILD_TAG $BUILD_TAG from Makefile." >&2
            exit 1
          fi

          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Workflow version $VERSION must match APP_VERSION $APP_VERSION from Makefile." >&2
            exit 1
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build number must be a positive integer." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists on origin. Choose a new release tag." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "appcast_path=$APPCAST_PATH" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      # Required GitHub secrets:
      #   DEVELOPER_ID_CERTIFICATE_BASE64 — base64-encoded .p12 with the Developer ID Application identity (and optionally Apple's G2 intermediate)
      #   DEVELOPER_ID_CERTIFICATE_PASSWORD — password for the .p12
      #   ASC_KEY_ID — App Store Connect API key ID for notarization
      #   ASC_ISSUER_ID — App Store Connect API issuer ID
      #   ASC_KEY_P8_BASE64 — base64-encoded App Store Connect API private key (.p8)
      #   SPARKLE_PRIVATE_KEY — Sparkle EdDSA private key for appcast signing
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "DEVELOPER_ID_CERTIFICATE_BASE64 secret is required." >&2
            exit 1
          fi

          if [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "DEVELOPER_ID_CERTIFICATE_PASSWORD secret is required." >&2
            exit 1
          fi

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          # Make sure Apple's Developer ID G2 intermediate is in this keychain so
          # the identity is valid without relying on the runner image. The .p12
          # may already carry it; otherwise download, verify, and import it.
          import_intermediate() {
            local name="$1" expected_sha256="$2"
            local path="$RUNNER_TEMP/$name.cer"
            if security find-certificate -a -Z "$KEYCHAIN_PATH" | grep -qi "SHA-256 hash: $expected_sha256"; then
              echo "$name is already in the signing keychain."
              return
            fi
            curl -fsSL --retry 3 -o "$path" "https://www.apple.com/certificateauthority/$name.cer"
            echo "$expected_sha256  $path" | shasum -a 256 -c -
            security import "$path" -k "$KEYCHAIN_PATH"
            rm -f "$path"
          }
          import_intermediate DeveloperIDG2CA f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Developer ID chains to Apple's trusted roots, so `find-identity -v`
          # reports it. Use its SHA-1 so codesign never picks another identity,
          # and fail early instead of signing with an empty identity.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary_api_key.p8"
          (umask 077 && echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH")
          xcrun notarytool store-credentials "notarytool-profile" \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      - name: Build, sign, notarize, and verify DMG
        run: make CODESIGN_IDENTITY="$CODESIGN_IDENTITY" NOTARY_PROFILE=notarytool-profile NOTARY_KEYCHAIN="$KEYCHAIN_PATH" VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="${{ steps.version.outputs.build_number }}" BUILD_TAG="${{ steps.version.outputs.tag }}" prepare-release-dmg

      - name: Generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          DMG_PATH: ${{ steps.version.outputs.dmg_path }}
          APPCAST_PATH: ${{ steps.version.outputs.appcast_path }}
          REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/generate-sparkle-appcast.sh

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"
          echo "PUSHED_RELEASE_TAG=${{ steps.version.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zap ${{ steps.version.outputs.version }}
          body: |
            Developer ID signed and notarized DMG with Sparkle appcast.

            Updating from Zap 0.1.11 or earlier: those builds used a self-signed certificate, so macOS asks you to grant Accessibility access to Zap again once. If window shortcuts stop working, remove Zap from System Settings > Privacy & Security > Accessibility and add it again.
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.version.outputs.dmg_path }}
            ${{ steps.version.outputs.appcast_path }}

      - name: Roll back release tag on failure
        if: failure() && env.PUSHED_RELEASE_TAG != ''
        run: |
          git push origin ":refs/tags/$PUSHED_RELEASE_TAG" || true

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/notary_api_key.p8"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
